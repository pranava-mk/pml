<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The numbers</title>
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="slide">
  <p class="kicker">Performance</p>
  <h2 class="heading">The quarter in three numbers</h2>
  <div class="grid-3">
    <div class="stat-block fx-fade-up">
      <p class="stat"><em>+38%</em></p>
      <p>Revenue growth year-over-year, ahead of the 30% plan.</p>
    </div>
    <div class="stat-block fx-fade-up" style="--fx-delay:0.2s">
      <p class="stat">92<em>%</em></p>
      <p>Net revenue retention across enterprise accounts.</p>
    </div>
    <div class="stat-block fx-fade-up" style="--fx-delay:0.4s">
      <p class="stat"><em>−11%</em></p>
      <p>Operating costs after infrastructure consolidation.</p>
    </div>
  </div>
  <div class="footer"><span>CONFIDENTIAL</span><span>02</span></div>
</div>
</body>
</html>
